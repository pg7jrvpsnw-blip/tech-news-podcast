name: Daily Podcast Build

# 仅手动触发:GitHub Actions 跑在 Azure 美国节点,无法访问 mify 内网 API。
# 实际每日调度在 Mac 本地 launchd 跑(scripts/daily.sh + plist)。
# 这个 workflow 仅作为"手动 rebuild 站点"的备用入口(例:你改了模板想强制重渲染时)。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run daily build
        env:
          # 摘要 LLM (走 mify OpenAI 兼容接口)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # TTS
          TTS_BACKEND: ${{ secrets.TTS_BACKEND }}
          OPENAI_TTS_MODEL: ${{ secrets.OPENAI_TTS_MODEL }}
          OPENAI_TTS_VOICE: ${{ secrets.OPENAI_TTS_VOICE }}
          # 播客元信息
          PODCAST_TITLE: ${{ secrets.PODCAST_TITLE }}
          PODCAST_AUTHOR: ${{ secrets.PODCAST_AUTHOR }}
          PODCAST_EMAIL: ${{ secrets.PODCAST_EMAIL }}
          PODCAST_DESCRIPTION: ${{ secrets.PODCAST_DESCRIPTION }}
          PODCAST_SITE_URL: ${{ secrets.PODCAST_SITE_URL }}
          PODCAST_LANGUAGE: ${{ secrets.PODCAST_LANGUAGE }}
          # Cloudflare R2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: uv run python -m src.main

      - name: Commit & push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          if git diff --staged --quiet; then
            echo "::notice::No changes to commit (today produced nothing)"
          else
            git commit -m "daily: $(TZ='Asia/Shanghai' date '+%Y-%m-%d') 自动生成"
            git push
          fi
