name: Daily Podcast Build

on:
  schedule:
    # 北京时间 07:23 = UTC 23:23 (前一天)。错开整点避开 GH Actions 排队高峰。
    - cron: "23 23 * * *"
  workflow_dispatch: # 支持仓库页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run daily build
        env:
          # Claude (mify/PPIO 或 Anthropic 官方)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          # OpenAI TTS
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_TTS_MODEL: ${{ secrets.OPENAI_TTS_MODEL }}
          OPENAI_TTS_VOICE: ${{ secrets.OPENAI_TTS_VOICE }}
          # 播客元信息
          PODCAST_TITLE: ${{ secrets.PODCAST_TITLE }}
          PODCAST_AUTHOR: ${{ secrets.PODCAST_AUTHOR }}
          PODCAST_EMAIL: ${{ secrets.PODCAST_EMAIL }}
          PODCAST_DESCRIPTION: ${{ secrets.PODCAST_DESCRIPTION }}
          PODCAST_SITE_URL: ${{ secrets.PODCAST_SITE_URL }}
          PODCAST_LANGUAGE: ${{ secrets.PODCAST_LANGUAGE }}
          # Cloudflare R2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: uv run python -m src.main

      - name: Commit & push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ site/
          if git diff --staged --quiet; then
            echo "::notice::No changes to commit (today produced nothing)"
          else
            git commit -m "daily: $(TZ='Asia/Shanghai' date '+%Y-%m-%d') 自动生成"
            git push
          fi
